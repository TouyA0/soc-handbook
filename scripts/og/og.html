<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image de partage</title>
    <!-- Polices et couleurs du site, lues telles quelles : l'image suit tokens.css sans rien recopier. -->
    <link rel="stylesheet" href="/src/styles/fonts.css" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      body {
        margin: 0;
        padding: var(--sp-12) var(--sp-8);
        background: var(--surface-2);
        color: var(--text);
        font-family: var(--font-sans);
      }
      main {
        display: grid;
        gap: var(--sp-8);
        justify-items: start;
        max-width: 1200px;
        margin: 0 auto;
      }
      canvas {
        width: 100%;
        height: auto;
        box-shadow: var(--shadow);
      }
      .previews {
        display: flex;
        flex-wrap: wrap;
        gap: var(--sp-8);
        align-items: start;
      }
      .previews figure {
        margin: 0;
        display: grid;
        gap: var(--sp-4);
        font-size: var(--fs-sm);
        color: var(--text-2);
      }
      .previews canvas {
        box-shadow: none;
        border: var(--bw) solid var(--border);
      }
      button {
        min-height: var(--tap);
        padding: 0 var(--sp-8);
        border: 0;
        border-radius: var(--r-sm);
        background: var(--ink);
        color: var(--on-ink);
        font: inherit;
        font-weight: var(--fw-bold);
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="og" width="1200" height="630" aria-label="Aperçu de l'image de partage"></canvas>
      <div class="previews">
        <figure>
          <canvas id="small" width="500" height="263"></canvas>
          <figcaption>Taille d'un fil LinkedIn ou Discord</figcaption>
        </figure>
        <figure>
          <canvas id="square" width="263" height="263"></canvas>
          <figcaption>Recadrage carré au centre (WhatsApp, iMessage)</figcaption>
        </figure>
      </div>
      <button type="button" id="save">Enregistrer public/og.png</button>
      <p id="status" role="status"></p>
    </main>

    <script type="module">
      const W = 1200;
      const H = 630;

      // Textes : la marque et le nom viennent de src/data/site.ts et src/data/profile.ts (via le serveur).
      const { site, name } = await fetch('/data.json').then((r) => r.json());
      const TITLE = 'Carnet d’analyste SOC';
      const BYLINE = 'En recherche de stage';
      // Méthode d'investigation de l'accueil (src/pages/index.astro) : station → ligne de la section où ce savoir vit.
      const METHOD = [
        { num: '01', title: 'Observer' },
        { num: '03', title: 'Détecter' },
        { num: '03', title: 'Qualifier' },
        { num: '04', title: 'Répondre' },
      ];

      const css = getComputedStyle(document.documentElement);
      const token = (name) => css.getPropertyValue(name).trim();
      const SANS = token('--font-sans');
      const MONO = token('--font-mono');

      await Promise.all([
        document.fonts.load(`800 72px ${SANS}`, TITLE + site),
        document.fonts.load(`700 34px ${SANS}`, name),
        document.fonts.load(`400 34px ${SANS}`, BYLINE),
        document.fonts.load(`700 30px ${MONO}`, '1234'),
      ]);

      const canvas = document.getElementById('og');
      const ctx = canvas.getContext('2d');

      /** Logo : le « k » de soc.kb en jonction de plan, même tracé que public/favicon.svg (viewBox 32). */
      function drawMark(x, y, size) {
        const s = size / 32;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 5.5;
        ctx.strokeStyle = token('--l03');
        ctx.stroke(new Path2D('M8 3v26'));
        ctx.strokeStyle = token('--l01');
        ctx.stroke(new Path2D('M27 5L10 19.5L27 29'));
        ctx.beginPath();
        ctx.arc(9, 19.5, 4.75, 0, Math.PI * 2);
        ctx.fillStyle = token('--surface');
        ctx.fill();
        ctx.lineWidth = 2.75;
        ctx.strokeStyle = token('--ink');
        ctx.stroke();
        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = token('--bg');
        ctx.fillRect(0, 0, W, H);
        ctx.textBaseline = 'alphabetic';

        // Tout ce qui se lit tient dans le carré central (SAFE px de large) : un aperçu recadré en carré
        // garde le logo, l'accroche et le nom entiers ; seules les stations extrêmes du tracé en sortent.
        const SAFE = 590;
        ctx.textAlign = 'center';

        // 1. Logo centré : pictogramme + « soc.kb ».
        const markSize = 76;
        ctx.font = `800 54px ${SANS}`;
        ctx.letterSpacing = '-1px';
        const brandW = ctx.measureText(site).width;
        const gap = 16;
        const lockW = markSize + gap + brandW;
        const lockX = (W - lockW) / 2;
        const lockY = 62;
        drawMark(lockX, lockY, markSize);
        ctx.fillStyle = token('--text');
        ctx.textAlign = 'left';
        ctx.fillText(site, lockX + markSize + gap, lockY + markSize * 0.75);

        // 2. Accroche, à la plus grande taille qui tient dans le carré central.
        ctx.textAlign = 'center';
        ctx.letterSpacing = '-1px';
        ctx.font = `800 100px ${SANS}`;
        const titleSize = Math.floor((100 * SAFE) / ctx.measureText(TITLE).width);
        ctx.font = `800 ${titleSize}px ${SANS}`;
        ctx.fillStyle = token('--text');
        ctx.fillText(TITLE, W / 2, 250);

        // 3. Signature : le nom, puis la recherche de stage.
        ctx.letterSpacing = '0px';
        ctx.font = `700 40px ${SANS}`;
        ctx.fillText(name, W / 2, 318);
        ctx.font = `400 32px ${SANS}`;
        ctx.fillStyle = token('--text-2');
        ctx.fillText(BYLINE, W / 2, 364);

        // 4. La méthode en ligne à quatre stations, tracé coloré par tiers comme sur l'accueil.
        const x0 = 190;
        const x1 = W - 190;
        const trackY = 464;
        const trackW = 12;
        const step = (x1 - x0) / (METHOD.length - 1);
        const grad = ctx.createLinearGradient(x0, 0, x1, 0);
        const stops = [
          [0, '--l01'],
          [1 / 3, '--l01'],
          [1 / 3, '--l03'],
          [2 / 3, '--l03'],
          [2 / 3, '--l04'],
          [1, '--l04'],
        ];
        for (const [at, name] of stops) grad.addColorStop(at, token(name));
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(x0, trackY - trackW / 2, x1 - x0, trackW, trackW / 2);
        ctx.fill();

        METHOD.forEach((m, i) => {
          const cx = x0 + i * step;
          const line = token(`--l${m.num}`);
          ctx.beginPath();
          ctx.arc(cx, trackY, 25, 0, Math.PI * 2);
          ctx.fillStyle = token('--surface');
          ctx.fill();
          ctx.lineWidth = 9;
          ctx.strokeStyle = line;
          ctx.stroke();

          // Libellé : numéro d'étape en mono, puis le nom de la station.
          const num = String(i + 1);
          ctx.font = `700 30px ${MONO}`;
          const numW = ctx.measureText(num).width;
          ctx.font = `800 34px ${SANS}`;
          const titleW = ctx.measureText(m.title).width;
          const labelGap = 10;
          const lx = cx - (numW + labelGap + titleW) / 2;
          ctx.textAlign = 'left';
          ctx.font = `700 30px ${MONO}`;
          ctx.fillStyle = line;
          ctx.fillText(num, lx, 543);
          ctx.font = `800 34px ${SANS}`;
          ctx.fillStyle = token('--text');
          ctx.fillText(m.title, lx + numW + labelGap, 543);
        });
      }

      draw();

      // Aperçus : taille réduite d'un fil d'actualité et recadrage carré central.
      const small = document.getElementById('small').getContext('2d');
      small.drawImage(canvas, 0, 0, 500, 263);
      const square = document.getElementById('square').getContext('2d');
      square.drawImage(canvas, (W - H) / 2, 0, H, H, 0, 0, 263, 263);

      const status = document.getElementById('status');
      document.getElementById('save').addEventListener('click', async () => {
        const blob = await new Promise((ok) => canvas.toBlob(ok, 'image/png'));
        const res = await fetch('/save', { method: 'POST', body: blob });
        status.textContent = res.ok ? `public/og.png enregistré (${(blob.size / 1024).toFixed(1)} Ko).` : await res.text();
      });
      document.documentElement.dataset.ready = 'true';
    </script>
  </body>
</html>
